[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-framework"
version = "1.1.0-alpha"
description = "Experimental framework that helps AI and Codex discover and reuse validated engineering capabilities in software projects."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.scripts]
atlas = "atlas_gateway.cli:main"

[tool.setuptools.packages.find]
where = [".", "packages/ai-execution/src", "packages/business-rule-modeling/src", "packages/dashboard-decision-workspace/src", "packages/enterprise-intake/src", "packages/file-lifecycle/src", "packages/knowledge-intake/src", "packages/notification-attention-routing/src", "packages/operation-outcome/src", "packages/report-export-semantics/src", "packages/runtime-config/src", "packages/tabular-input/src", "packages/traceability-audit/src", "packages/ui-quality/src"]
include = ["atlas_gateway*", "atlas_consumer*", "atlas_ai_execution*", "atlas_business_rule_modeling*", "atlas_decision_workspace*", "atlas_enterprise_intake*", "atlas_file_lifecycle*", "atlas_knowledge_intake*", "atlas_attention_routing*", "atlas_operation_outcome*", "atlas_report_export*", "atlas_runtime_config*", "atlas_tabular*", "atlas_traceability_audit*", "atlas_ui_quality*"]

[tool.setuptools.package-data]
atlas_gateway = [
  "resources/*.json",
  "resources/skills/atlas-gateway/*",
  "resources/skills/atlas-gateway/**/*",
]
